name: ci

# Checks every pull request and push to main; deploys main to getazcertified.com after approval.
#
# Who changes what (job `check` enforces it):
# - questions and their docs are owned here: anyone, also from a fork, opens a PR (CONTRIBUTING.md);
# - the app (app/, .node-version) arrives only as release PRs (snapshots from the development repo);
# - the rest (.github/, site/, scripts) only from branches of this repo.
# Job `questions` also leaves a feedback artifact on PRs; pr-feedback.yml turns it into a comment + labels.
#
# Security: permissions {} at the top and least privilege per job; checkout without persisted credentials; only
# GitHub-owned actions + azure/login, all pinned by commit SHA; npm installs without lifecycle scripts; no secrets.
# Deploy: environment "production" (main only, a required reviewer approves every run) → Azure OIDC as
# id-getazcertified-prod-deploy (trusts only that environment) → Cloudflare token from Key Vault → wrangler.

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  PAGES_PROJECT: getazcertified
  WRANGLER_VERSION: 4.160.0
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Who may change which paths (contributions, releases, maintainer)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          HEAD_REPO=$(jq -r '.pull_request.head.repo.full_name' "$GITHUB_EVENT_PATH")
          changed=$(git diff --name-only "origin/${BASE_REF}...HEAD")
          # Kept in sync with the dev repo's infra/sync-from-prod.sh (CONTRIBUTOR_PATHS).
          contributor='^(questions/|docs/question-style/|scripts/(test_)?check_questions\.py$|cspell\.json$|CONTRIBUTING\.md$)'
          release='^(app/|\.node-version$)'
          fail() { echo "::error::$1"; printf '%s\n' "$2" | head -20; exit 1; }
          if [[ "$HEAD_REF" == release/* && "$HEAD_REPO" == "$GITHUB_REPOSITORY" ]]; then
            other=$(grep -vE "$release" <<<"$changed" || true)
            [[ -z "$other" ]] || fail "A release PR carries only app/ and .node-version; questions are changed by PRs here. Other paths:" "$other"
          else
            app=$(grep -E "$release" <<<"$changed" || true)
            [[ -z "$app" ]] || fail "The site's code (app/) is released from the development repo and isn't open to pull requests yet; please open an issue instead (https://github.com/Toonssen/getazcertified/issues/new/choose). Paths:" "$app"
            if [[ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]]; then
              outside=$(grep -vE "$contributor" <<<"$changed" || true)
              [[ -z "$outside" ]] || fail "Pull requests from a fork can change the questions and their docs (questions/, docs/question-style/, cspell.json, CONTRIBUTING.md, the question checker). For anything else please open an issue. Paths:" "$outside"
            fi
          fi
          echo "paths: ok"
      - name: Landing page checks (references, no third-party loads, no scripts, security headers)
        run: python3 scripts/check_site.py
      - name: No github.event expressions in workflows (untrusted input; read $GITHUB_EVENT_PATH with jq instead)
        run: |
          set -euo pipefail
          # Same rule as the repo audit: event payload fields (github.event_name is fine). Pattern split so this line can't match itself.
          pattern='$''{{ github.event.'
          if grep -nF "$pattern" .github/workflows/*.yml; then
            echo "::error::Workflows must not use event payload expressions (untrusted input); read the value from \$GITHUB_EVENT_PATH with jq in the step."
            exit 1
          fi
      - name: actionlint (pinned release, checksum verified)
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$tarball"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  questions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      CSPELL_VERSION: 10.4.1
      npm_config_ignore_scripts: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
      - name: Changed question files (PRs; push to main checks every question)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/feedback"
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            jq -r '.pull_request.number' "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/feedback/pr.txt"
            git diff --name-only --diff-filter=d "origin/${BASE_REF}...HEAD" -- 'questions/' > "$RUNNER_TEMP/changed.txt"
          else
            git ls-files 'questions/' > "$RUNNER_TEMP/changed.txt"
          fi
          grep -E '^questions/en/[^/]+/question-[0-9]+\.md$' "$RUNNER_TEMP/changed.txt" > "$RUNNER_TEMP/questions.txt" || true
          wc -l "$RUNNER_TEMP/changed.txt" "$RUNNER_TEMP/questions.txt"
      - name: Checker tests
        run: python -m unittest discover -s scripts -v
      - name: Question rules (changed questions also get their Learn links checked)
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          mapfile -t files < "$RUNNER_TEMP/questions.txt"
          if [[ "$GITHUB_EVENT_NAME" == pull_request && ${#files[@]} -gt 0 ]]; then
            python scripts/check_questions.py --links --report "$RUNNER_TEMP/feedback/report.json" "${files[@]}"
          else
            python scripts/check_questions.py --report "$RUNNER_TEMP/feedback/report.json"
          fi
      - name: Spelling (cspell, pinned; real Azure terms go in cspell.json)
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          mapfile -t files < "$RUNNER_TEMP/questions.txt"
          : > "$RUNNER_TEMP/feedback/spelling.txt"
          (( ${#files[@]} )) || { echo "no question files changed"; exit 0; }
          status=0
          npx --yes "cspell@${CSPELL_VERSION}" --no-progress --no-summary --no-color --config cspell.json "${files[@]}" > "$RUNNER_TEMP/cspell.txt" || status=$?
          cat "$RUNNER_TEMP/cspell.txt"
          # "path:line:col - Unknown word (xyz)" → inline annotation + the feedback comment
          sed -nE 's#^(\./)?([^:]+):([0-9]+):([0-9]+) - (.*)$#\2:\3: \5#p' "$RUNNER_TEMP/cspell.txt" > "$RUNNER_TEMP/feedback/spelling.txt"
          sed -nE 's#^(\./)?([^:]+):([0-9]+):([0-9]+) - (.*)$#::error file=\2,line=\3,col=\4,title=Spelling::\5#p' "$RUNNER_TEMP/cspell.txt"
          exit "$status"
      - name: Feedback for the PR comment (read by pr-feedback.yml, treated as untrusted there)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-feedback
          path: ${{ runner.temp }}/feedback/
          retention-days: 3

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: hashFiles('app/package-lock.json') != ''
        with:
          node-version-file: '.node-version'
      - name: Install (no lifecycle scripts)
        if: hashFiles('app/package-lock.json') != ''
        run: npm ci --ignore-scripts
        working-directory: app
      - name: Unit tests
        if: hashFiles('app/package-lock.json') != ''
        run: npm test
        working-directory: app

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: hashFiles('app/package-lock.json') != ''
        with:
          node-version-file: '.node-version'
      - name: Install (no lifecycle scripts)
        if: hashFiles('app/package-lock.json') != ''
        run: npm ci --ignore-scripts
        working-directory: app
      - name: Build the sneak peek
        if: hashFiles('app/package-lock.json') != ''
        run: npm run build
        working-directory: app
        env:
          NEXT_PUBLIC_SITE_MODE: preview
          NEXT_PUBLIC_SITE_URL: https://getazcertified.com
          NEXT_PUBLIC_SITE_REPO: Toonssen/getazcertified
      - name: Assemble app + landing page, generate CSP
        if: hashFiles('app/package-lock.json') != ''
        run: python3 scripts/assemble.py app/out dist
      - name: Landing page only (no app released yet)
        if: hashFiles('app/package-lock.json') == ''
        run: cp -r site dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          include-hidden-files: false
          retention-days: 3

  e2e:
    needs: [ build ]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: hashFiles('app/package-lock.json') != ''
        with:
          node-version-file: '.node-version'
      - name: Install (no lifecycle scripts) + Chromium
        if: hashFiles('app/package-lock.json') != ''
        working-directory: app
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: E2E against the built site with production headers (CSP enforced)
        if: hashFiles('app/package-lock.json') != ''
        env:
          E2E_BASE_URL: http://127.0.0.1:4173
          E2E_PREVIEW: '1'
        run: |
          set -euo pipefail
          python3 scripts/serve.py dist 4173 > "$RUNNER_TEMP/serve.log" 2>&1 &
          for _ in $(seq 1 30); do curl -fs -o /dev/null http://127.0.0.1:4173/ && break; sleep 1; done
          cd app
          npx playwright test --reporter=list
      - name: Server log
        if: failure()
        run: cat "$RUNNER_TEMP/serve.log" || true

  deploy:
    needs: [ check, questions, unit, build, e2e ]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: https://getazcertified.com
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Read Cloudflare deploy token from Key Vault
        env:
          KEY_VAULT_NAME: ${{ vars.KEY_VAULT_NAME }}
        run: |
          set -euo pipefail
          token=$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name cloudflare-pages-prod-deploy-token --query value -o tsv)
          echo "::add-mask::$token"
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
          az logout
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes "wrangler@${WRANGLER_VERSION}" pages deploy dist --project-name "$PAGES_PROJECT" --branch main --commit-dirty=true
